{% extends 'admin_dashboard/_admin_base.html' %}
{% block title %}Delete Announcement{% endblock %}

{% block admin_content %}
<div class="card shadow-sm">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        <h4 class="mt-3">Delete Announcement?</h4>
        <p class="text-muted">
            You are about to delete <strong>{{ announcement.title }}</strong>. This cannot be undone.
        </p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Yes, Delete
            </button>
            <a href="{% url 'admin_dashboard:announcements_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
